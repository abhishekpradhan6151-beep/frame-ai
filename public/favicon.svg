<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glass Squircle Base Gradient -->
    <linearGradient id="squircle_base" x1="16" y1="10" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e212d" />
      <stop offset="30%" stop-color="#12131b" />
      <stop offset="70%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Outer Rim Specular Bevel -->
    <linearGradient id="squircle_rim" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Inner Radial Ambient Glow -->
    <radialGradient id="squircle_glow" cx="45" cy="40" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass F Top Bar Gradient -->
    <linearGradient id="f_top_bar" x1="45" y1="25.5" x2="76" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glass F Middle Bar Gradient -->
    <linearGradient id="f_mid_bar" x1="45" y1="46.5" x2="68" y2="59.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <!-- Glass F Vertical Stem Gradient -->
    <linearGradient id="f_stem" x1="36" y1="35" x2="50" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Perspective Fold Facet -->
    <linearGradient id="f_fold" x1="36" y1="45" x2="47" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Corner Specular Star Flare -->
    <radialGradient id="star_flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Glass Squircle Body -->
  <rect x="8" y="8" width="84" height="84" rx="23" ry="23" fill="url(#squircle_base)" stroke="url(#squircle_rim)" stroke-width="1.25" />
  <rect x="8" y="8" width="84" height="84" rx="23" ry="23" fill="url(#squircle_glow)" />
  
  <!-- Subtle Inner Glass Bevel Contour -->
  <rect x="9.5" y="9.5" width="81" height="81" rx="21.5" ry="21.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.18" />

  <!-- Corner Specular Flare (Top-Left) -->
  <g transform="translate(18, 13)">
    <circle cx="0" cy="0" r="5.5" fill="url(#star_flare)" />
    <path d="M -8 0 Q 0 -0.8 8 0 Q 0 0.8 -8 0 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 0 -8 Q -0.8 0 0 8 Q 0.8 0 0 -8 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="0" r="1.4" fill="#ffffff" />
  </g>
  <!-- Bottom-Right Subtle Glint -->
  <circle cx="81" cy="85" r="1.2" fill="#ffffff" opacity="0.7" />

  <!-- --- 3D TRANSLUCENT GLASS "F" --- -->

  <!-- 1. Left Fold Facet (Background perspective ribbon) -->
  <path
    d="M 46 25.5 L 36 40 L 36 58 L 46 43 Z"
    fill="url(#f_fold)"
  />
  <line x1="36" y1="40" x2="46" y2="25.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
  <line x1="36" y1="40" x2="36" y2="58" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.7" />

  <!-- 2. Main Vertical Stem with Loop Terminal -->
  <path
    d="M 36 40 L 36 63.5 C 36 70.5 40.5 74.5 46.5 74.5 C 48 74.5 48.5 73.5 48.5 71.5 L 48.5 25.5 L 46 25.5 C 41 25.5 36 33 36 40 Z"
    fill="url(#f_stem)"
  />
  <!-- Stem Outer Glowing Edge Lines -->
  <path
    d="M 36 40 L 36 63.5 C 36 70.5 40.5 74.5 46.5 74.5"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Stem Inner Crease Line for 3D Depth -->
  <line x1="46" y1="25.5" x2="46" y2="41" stroke="rgba(0, 0, 0, 0.35)" stroke-width="1" />
  <line x1="47" y1="25.5" x2="47" y2="41" stroke="rgba(255, 255, 255, 0.45)" stroke-width="0.75" />

  <!-- 3. Top Horizontal Arm -->
  <path
    d="M 46 25.5 L 75 25.5 C 75.6 25.5 76 26.1 75.7 26.6 L 65.5 40.5 C 65.2 41 64.6 41 64 41 L 46 41 Z"
    fill="url(#f_top_bar)"
  />
  <!-- Top Arm Beveled Edge Highlights -->
  <line x1="46" y1="25.5" x2="75" y2="25.5" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" />
  <line x1="75" y1="25.5" x2="65.5" y2="40.5" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity="0.9" />
  <line x1="65.5" y1="41" x2="46" y2="41" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.8" />

  <!-- 4. Middle Horizontal Arm -->
  <path
    d="M 46 46.5 L 67 46.5 C 67.6 46.5 68 47.1 67.7 47.6 L 58.5 59 C 58.2 59.5 57.6 59.5 57 59.5 L 46 59.5 Z"
    fill="url(#f_mid_bar)"
  />
  <!-- Middle Arm Beveled Edge Highlights -->
  <line x1="46" y1="46.5" x2="67" y2="46.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
  <line x1="67" y1="46.5" x2="58.5" y2="59" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.85" />
  <line x1="58.5" y1="59.5" x2="46" y2="59.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="0.8" />

  <!-- Overlap Glint highlight where middle bar intersects stem -->
  <path
    d="M 46 46.5 L 46 59.5"
    stroke="rgba(255, 255, 255, 0.4)"
    stroke-width="0.8"
  />
</svg>